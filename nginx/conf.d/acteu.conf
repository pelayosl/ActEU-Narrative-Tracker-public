# ActEU Narrative Tracker — reverse proxy site config.
#
# nginx is the only externally reachable component. It terminates TLS and
# forwards everything to the Next.js BFF (`frontend:3000`), which in turn
# reaches FastAPI server-side over the internal docker network. FastAPI,
# MongoDB and Redis are never exposed directly.

# Upstream: the Next.js container on the internal acteu_net network.
upstream nextjs {
    server frontend:3000;
    keepalive 32;
}

# --- HTTP :80 — redirect everything to HTTPS ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 156.35.163.169;

    # Block hidden/dot files even on the redirect listener.
    location ~ /\. { deny all; }

    return 301 https://$host$request_uri;
}

# --- HTTPS :443 — the application ---------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 156.35.163.169;

    # --- TLS ------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_dhparam         /etc/nginx/certs/dhparam.pem;

    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  on;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    # OCSP stapling intentionally omitted: not applicable to an internal CA.

    # --- Security response headers --------------------------------------
    # HSTS without preload (host is an IP behind the university VPN).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # Starter CSP. Next.js may need 'unsafe-inline'/'unsafe-eval' for some
    # runtime chunks; relax the script-src/style-src here if the console
    # reports CSP violations after deployment.
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Per-IP concurrent connection cap.
    limit_conn conns 20;

    # Deny hidden/dot files.
    location ~ /\. { deny all; }

    # --- Credential submission — tight rate limit (brute-force defence) -
    # Only the actual login POST is throttled hard. The rest of /api/auth/
    # (session, providers, csrf, _log) is NextAuth's normal per-page-load
    # chatter and must NOT hit the tight bucket, or every page load 503s.
    location = /api/auth/callback/credentials {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- Other NextAuth endpoints — general rate limit ------------------
    location /api/auth/ {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- Backend BFF (includes SSE job streams) — no buffering ----------
    # Long-running NLP jobs stream progress via Server-Sent Events through
    # /api/backend/jobs/{id}/stream. Buffering must be off and read timeout
    # high so events flush immediately and the connection is not cut mid-job.
    location /api/backend/ {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- Everything else (pages, static assets) ------------------------
    location / {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
