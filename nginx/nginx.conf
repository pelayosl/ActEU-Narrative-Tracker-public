# Top-level nginx configuration for the ActEU Narrative Tracker reverse proxy.
# Site-specific server blocks live in conf.d/acteu.conf.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in headers or error pages.
    server_tokens  off;

    # --- Logging ---------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # --- Core tuning -----------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # --- Slowloris / resource-exhaustion mitigation ----------------------
    client_body_timeout    10s;
    client_header_timeout  10s;
    send_timeout           30s;
    client_body_buffer_size      16k;
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;
    # App uploads almost nothing; classifier .bin is a download, not an upload.
    client_max_body_size   10m;

    # --- Rate limiting zones (applied per-location in the site config) ---
    # General browsing traffic.
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    # Tighter bucket for authentication to blunt credential brute-forcing.
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=5r/m;
    # Per-IP concurrent connection cap.
    limit_conn_zone $binary_remote_addr  zone=conns:10m;

    # --- Compression -----------------------------------------------------
    # gzip is enabled for static asset types only. Proxied API/JSON responses
    # are NOT compressed here (BREACH-safe, since responses may carry tokens).
    gzip              on;
    gzip_vary         on;
    gzip_proxied      off;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript
                      application/x-javascript text/xml application/xml
                      image/svg+xml font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
